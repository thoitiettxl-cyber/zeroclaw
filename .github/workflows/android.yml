name: Android Build zeroclaw.tar.xz (Latest Upstream Tag)

on:
  workflow_dispatch:
    inputs:
      sync_fork_main:
        description: "Sync fork main <- upstream/main trước khi build"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-latest-upstream-tag
  cancel-in-progress: false

jobs:
  sync-upstream:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_fork_main == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync fork main with upstream/main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/zeroclaw-labs/zeroclaw.git 2>/dev/null || true
          git fetch upstream +refs/heads/main:refs/remotes/upstream/main --no-tags

          git checkout main
          git reset --hard upstream/main
          git push origin main --force-with-lease

  build-android-tarxz:
    needs: [sync-upstream]
    if: ${{ always() && (needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped') }}
    runs-on: ubuntu-latest        # ← GitHub cloud, không cần điện thoại
    env:
      CARGO_TERM_COLOR: always
      ANDROID_TARGET: aarch64-linux-android
      ANDROID_API: "24"           # Android 7.0+, đủ cho hầu hết thiết bị

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest upstream tag (v*)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/zeroclaw-labs/zeroclaw.git 2>/dev/null || true

          LATEST_TAG="$(git ls-remote --tags --refs upstream 'v*' \
            | awk -F/ '{print $3}' | sort -V | tail -n1)"
          if [ -z "$LATEST_TAG" ]; then
            echo "No upstream tag matched v*" >&2
            exit 1
          fi

          git fetch upstream "refs/tags/$LATEST_TAG:refs/tags/$LATEST_TAG" --no-tags
          git checkout "tags/$LATEST_TAG"

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Building tag: $LATEST_TAG"

      - name: Install Rust + Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          # Thêm cross-compile target Android ARM64
          rustup target add aarch64-linux-android

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c      # NDK LTS, stable

      - name: Configure cross-compile linker
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="${NDK_BIN}/aarch64-linux-android${ANDROID_API}-clang"

          echo "NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"

          # Cấu hình cargo dùng NDK clang làm linker
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "${LINKER}"
          ar     = "${NDK_BIN}/llvm-ar"
          EOF

          echo "Linker: $LINKER"

      - name: Build release (cross-compile → Android ARM64)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-linux-android

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/aarch64-linux-android/release/zeroclaw"

          ls -lh "$BIN"
          file "$BIN"

          # Kiểm tra: phải là ARM aarch64, linker phải là /system/bin/linker64
          file "$BIN" | grep -q 'ARM aarch64' || { echo "FAIL: not ARM aarch64"; exit 1; }
          readelf -l "$BIN" | grep -q 'linker64'   || { echo "WARN: linker64 not found"; }

          echo "NEEDED libs (expect Bionic only):"
          readelf -d "$BIN" | grep NEEDED

          echo "RUNPATH (expect none or Termux path to be removed):"
          readelf -d "$BIN" | grep -E 'RPATH|RUNPATH' || echo "<none — correct>"

      - name: Pack zeroclaw.tar.xz
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/aarch64-linux-android/release/zeroclaw"

          mkdir -p dist/stage/bin
          install -m 0755 "$BIN" dist/stage/bin/zeroclaw

          REPORT="dist/zeroclaw-portable-report.txt"
          INFO="dist/build-info.txt"

          {
            echo "tag=${{ steps.meta.outputs.latest_tag }}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "target=aarch64-linux-android"
            echo "android_api=${ANDROID_API}"
            echo "ndk=r27c"
          } > "$INFO"

          {
            echo "## NEEDED libs"
            readelf -d dist/stage/bin/zeroclaw | grep NEEDED
            echo
            echo "## RUNPATH before patch"
            readelf -d dist/stage/bin/zeroclaw | grep -E 'RPATH|RUNPATH' || echo "<none>"
          } > "$REPORT"

          # NDK build thường không embed Termux path
          # Nhưng verify và patch nếu có
          RUNPATH=$(readelf -d dist/stage/bin/zeroclaw \
            | grep -E 'RPATH|RUNPATH' | awk -F'[][]' '{print $2}' || true)

          if echo "$RUNPATH" | grep -q 'com.termux'; then
            patchelf --remove-rpath dist/stage/bin/zeroclaw
            echo "PATCHED: removed Termux RUNPATH" >> "$REPORT"
          else
            echo "PASS: no Termux path" >> "$REPORT"
          fi

          {
            echo
            echo "## RUNPATH after patch"
            readelf -d dist/stage/bin/zeroclaw | grep -E 'RPATH|RUNPATH' || echo "<none — correct>"
            echo
            echo "## arch check"
            file dist/stage/bin/zeroclaw
          } >> "$REPORT"

          # Smoke test: không thể chạy ARM64 trên ubuntu x86_64
          # Chỉ verify arch
          file dist/stage/bin/zeroclaw | grep -q 'ARM aarch64' \
            && echo "PASS: ARM aarch64 confirmed" >> "$REPORT" \
            || { echo "FAIL: unexpected arch"; exit 1; }

          tar -C dist/stage -cJf dist/zeroclaw.tar.xz .
          xz -lv dist/zeroclaw.tar.xz
          cat "$REPORT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-android-${{ steps.meta.outputs.latest_tag }}
          path: |
            dist/zeroclaw.tar.xz
            dist/zeroclaw-portable-report.txt
            dist/build-info.txt
